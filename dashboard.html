<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAKSH Owner Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: white; margin: 0; display: flex; }
        .sidebar { width: 250px; background-color: #111827; height: 100vh; padding: 20px; border-right: 1px solid #1f2937; }
        .sidebar h2 { color: #7c3aed; }
        .menu-item { padding: 10px; margin-bottom: 5px; border-radius: 5px; cursor: pointer; }
        .menu-item.active { background-color: #7c3aed; }
        .main-content { flex: 1; padding: 30px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1f2937; padding: 20px; border-radius: 10px; border: 1px solid #374151; }
        .stat-title { color: #9ca3af; font-size: 14px; }
        .stat-value { font-size: 24px; font-weight: bold; margin-top: 10px; }
        .stat-growth { color: #22c55e; font-size: 12px; }
        
        .chart-placeholder { background: #1f2937; height: 300px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #555; border: 2px dashed #374151; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>ZAKSH</h2>
        <div class="menu-item active">Dashboard</div>
        <div class="menu-item">Users</div>
        <div class="menu-item">Balances</div>
        <div class="menu-item">Mining</div>
        <div class="menu-item">Tasks</div>
        <div class="menu-item">Referrals</div>
        <div class="menu-item">Settings</div>
    </div>

    <div class="main-content">
        <h1>Owner Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Users</div>
                <div class="stat-value">12,482</div>
                <div class="stat-growth">+2.5%</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Balance (ZKO)</div>
                <div class="stat-value">2,845,670</div>
                <div class="stat-growth">+1.8%</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Mining</div>
                <div class="stat-value">8,421</div>
                <div class="stat-growth">+2.2%</div>
            </div>
        </div>

        <div class="chart-placeholder">
            (اینجا محل قرارگیری نمودارها با استفاده از کتابخانه‌ای مثل Chart.js است)
        </div>
    </div>

</body>
</html>
